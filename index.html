<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cute Checkers Arena</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- GAME SCREEN -->

<div id="gameScreen" class="hidden">

    <div class="topBar">

        <div>💰 <span id="coinDisplay">100</span></div>

        <div>⭐ <span id="expDisplay">0</span></div>

        <div>🥉 Bronze</div>

    </div>

    <div id="board"></div>

    <button id="backBtn">
        ⬅ กลับเมนู
    </button>

</div>
<!-- Splash Screen -->
<div id="splash">

    <div class="logo-container">

        <h1 id="gameTitle">
            Cute Checkers Arena
        </h1>

        <div class="sparkles"></div>
        <div id="floatingStars"></div>

        <p class="tapText">
            แตะเพื่อเริ่ม
        </p>

    </div>

</div>

<!-- Main Menu -->
<div id="menu" class="hidden">

    <div class="menu-card">

        <h1>🏆 Cute Checkers</h1>

        <div class="playerInfo">

            <div>💰 Coins: <span id="coins">100</span></div>

            <div>⭐ EXP: <span id="exp">0</span></div>

            <div>🥉 Rank: Bronze</div>

        </div>

        <button id="playBigBtn">
▶ PLAY
</button>

<button class="menuBtn" id="practiceBtn">
🎮 โหมดฝึกเล่น
</button>

<button class="menuBtn" id="rankBtn">
🏆 โหมดแรงค์
</button>

        <button class="menuBtn">
            🛒 ร้านค้า
        </button>

        <button class="menuBtn">
            📊 สถิติ
        </button>

        <button class="menuBtn">
            ⚙ ตั้งค่า
        </button>

    </div>

</div>

<script src="js/main.js"></script>
<script src="js/game.js"></script>
    
</body>
</html>
